name: Release

# Runs when a tag starting with v (v1.6.0, etc.) is pushed — also triggered by
# moonkata-reader-project (the umbrella repo) pushing that same tag down to this repo. Only builds
# the vsix and attaches it to the GitHub Release — the actual Marketplace publish (`vsce publish`)
# isn't automated, since it needs account authentication and is done by hand on purpose.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Compute release version
        id: version
        run: echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # vsce only accepts a semver from package.json and rejects prerelease tags (-beta, etc.) — if
      # such a tag comes through, this step is meant to just fail and no release gets created.
      - name: Set package.json version to match tag
        run: npm version --no-git-tag-version --allow-same-version ${{ steps.version.outputs.name }}

      # If SUPABASE_URL/SUPABASE_PUBLISHABLE_KEY aren't set as repo secrets,
      # scripts/generate-supabase-config.js silently fills them with empty strings, and the vsix
      # this workflow builds gets packaged with the sync feature disabled — the build itself doesn't
      # fail (same design as app/build.gradle.kts).
      - name: Package extension (.vsix)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: npx vsce package

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: "*.vsix"
          generate_release_notes: true
          # GitHub adds a "Pre-release" badge if the tag name contains -beta.
          prerelease: ${{ contains(github.ref_name, '-beta') }}
