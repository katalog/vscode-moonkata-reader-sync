name: Release

# v로 시작하는 태그(v1.6.0 등)를 push하면 실행된다 — moonkata-reader-project(우산 저장소)에서 같은
# 태그를 이 저장소로 내려보내는 방식으로도 트리거된다. vsix를 빌드해 GitHub Release에 첨부까지만
# 하고, 실제 마켓플레이스 publish(`vsce publish`)는 자동화하지 않는다 — 계정 인증이 필요한 단계라
# 의도적으로 사람이 직접 한다.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Compute release version
        id: version
        run: echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # vsce는 package.json의 semver만 받아들이고 prerelease 태그(-beta 등)를 허용하지 않는다 —
      # 그런 태그가 오면 이 스텝에서 그냥 실패하고 릴리스가 안 만들어지는 게 의도된 동작이다.
      - name: Set package.json version to match tag
        run: npm version --no-git-tag-version --allow-same-version ${{ steps.version.outputs.name }}

      # SUPABASE_URL/SUPABASE_PUBLISHABLE_KEY가 저장소 시크릿으로 없으면 scripts/generate-supabase-config.js가
      # 조용히 빈 문자열로 채우고, 그 경우 이 워크플로우가 만드는 vsix는 동기화 기능이 비활성화된 채로
      # 패키징된다 — 빌드 자체는 실패하지 않는다(app/build.gradle.kts와 같은 설계).
      - name: Package extension (.vsix)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: npx vsce package

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: "*.vsix"
          generate_release_notes: true
          # 태그 이름에 -beta가 있으면 GitHub이 "Pre-release" 배지를 붙인다.
          prerelease: ${{ contains(github.ref_name, '-beta') }}
